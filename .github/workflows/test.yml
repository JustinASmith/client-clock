name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the version the mod was built on, and the newest, since mods are early access
        claude-code: ['2.1.286', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - run: claude --version
      - run: claude plugin validate .claude-plugin/plugin.json
      - run: claude plugin validate .claude-plugin/marketplace.json
      - run: claude plugin test .
